services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=demo_secret_key
      - GEMINI_API_KEY=${GEMINI_API_KEY:-mock-key}
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
    depends_on:
      - redis
      - db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_db
    ports:
      - "5432:5432"